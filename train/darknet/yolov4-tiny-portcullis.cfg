# Portcullis YOLOv4-tiny: AlexeyAB/darknet cfg/yolov4-tiny-custom.cfg (59596d78) with
# classes=6, filters=(6+5)*3=33, letterbox input, and max_batches=6000 (steps at 80%/90%).
# Input is 896x672, the 4:3 camera frame at a multiple of 32, so letterboxing adds no bars.
# Anchors are k-means (1 - IoU) over the v2 dataset boxes at 896x672 (mean best IoU 0.81).
[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=64
# 896x672 is ~3.5x the pixels of 416x416: 16-image mini-batches for a 16 GB T4 (8 if it OOMs).
subdivisions=4
letter_box=1
width=896
height=672
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation = 1.5
exposure = 1.5
hue=.1

learning_rate=0.00261
burn_in=1000
max_batches = 6000
policy=steps
steps=4800,5400
scales=.1,.1

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
