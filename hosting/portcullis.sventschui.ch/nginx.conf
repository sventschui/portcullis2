# Hardened static server. Everything writable lives in /tmp so the root filesystem can be read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No request logging: invite fragments never arrive, but keep URLs out of logs anyway.
    access_log off;

    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Static GET/HEAD only, tiny requests.
    client_max_body_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;

    limit_conn_zone $binary_remote_addr zone=perip:1m;
    limit_req_zone  $binary_remote_addr zone=reqs:1m rate=20r/s;

    # Traefik is the only client; recover the real client address for limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/www;

        limit_conn perip 20;
        limit_req zone=reqs burst=40 nodelay;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Rewrite (never redirect): a redirect can drop the URL fragment.
        location = /invite  { try_files /invite.html =404; include /etc/nginx/security-headers.conf; }
        location = /invite/ { try_files /invite.html =404; include /etc/nginx/security-headers.conf; }

        location = /.well-known/apple-app-site-association {
            default_type application/json;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /invite.html { include /etc/nginx/security-headers.conf; }
        location = /invite.css  { include /etc/nginx/security-headers.conf; }

        location / { return 404; }
    }
}
